# Run settings for run_normal.sh / run_preemptable.sh:
#   bash run_normal.sh --settings settings/<name>.yaml   (e.g. this file)
# Copy this file to define a new run. Every key is required.

results_dir: results_refusal_layer_sweep        # all outputs (generations, judge-evals/, stats/) + a settings.yaml copy; relative to the repo root
models: [llama]   # any of olmo, qwen, qwen3, gemma, gemma4, llama
datasets: [refusal-help-hurt] # any tag in utils/dataset_registry.py
steering_type: last, mean         # e.g. [last, mean, positional]; null = run_steering.sh default
jacobian: null              # Jacobian-lens steering aspects (see jacobian/verse_llama_jacobian.yaml); null = none
steering_n: [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5]   # N sweep: null = run_steering.sh tables, a list for every model, or {llama: [...], olmo: [...]}
global_steering_n: [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4]    # global-scope N sweep, same format as steering_n (null = run_steering.sh's STEERING_N_GLOBAL tables)
normalization: false        # false = unnormalized steering vectors
scope: local                # local = steer one layer at a time | global = every layer at once | [local, global] = both (one job each, in parallel)
local_layer:                # ignored when scope is global
  mode: single
  single: 2/3
  sweep: [0, 1]             # every layer, one at a time
split: val
generation: false
judging: true               # false = generate only, skip judging and the held-out scores
judge: [gpt-6-luna]
api_judge_layers: [21]
api_judge_n: null
no_model_cache: false
metric: harmonic            # harmonic | pass_rate
train_batch_size: 100        # steering-vector activation pass
generation_batch_size: 50    # validation sweep and held-out test generation

# run_preemptable.sh only (must stay null/false for run_normal.sh)
seed: null
hook_prompt_acts: false       # save prompt-token activations (verse only)
hook_response_acts: false     # generate responses, save response-token activations (verse only)
hook_target_acts: false       # generate + save prompt/response activations for verse-valid / verse-test (verse only)
hook_batch_size: null           # batch size for all hooks (required when any is on, null otherwise)
